[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizkit"
dynamic = ["version"]
description = "中文数据图表生成器:20 种图表 × 13 主题,输出 PNG/PDF/TIF/GIF/MP4,CLI 与 MCP 双入口"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Quasar" }]
requires-python = ">=3.10"
keywords = ["chart", "matplotlib", "chinese", "mcp", "gif", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "pillow>=12.3",
    "mcp>=2.2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.6"]

[project.scripts]
vizkit = "vizkit.cli:main"

[tool.hatch.version]
path = "src/vizkit/__init__.py"  # 版本单源化:pyproject 动态读 __version__

[tool.hatch.build.targets.wheel]
packages = ["src/vizkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use('Agg') 必须在 pyplot import 之前,模块顶部因此存在非 import 语句
"src/vizkit/core.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
