name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 20 * * 1" # 每周一 20:30 UTC(周二 4:30 北京):全量回归兜底

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" # ruff 版本随 [dev] extra 锁定,新规则不会让 lint 意外变红
      - run: ruff check src tests examples

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # 渲染型用例挂了不会一直占 runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: chartmove themes # 控制台脚本入口 smoke(只打印文本,无需中文字体)
        env:
          PYTHONIOENCODING: utf-8
      - run: python -c "import chartmove.mcp_server" # MCP 入口可导入
      # PR 只跑冒烟(-m "not slow":跳过全速动画/全类型矩阵/MCP 会话,约 1 分钟);
      # main push 与每周定时跑全量兜底
      - run: pytest -q -n auto --dist loadgroup ${{ github.event_name == 'pull_request' && '-m not slow' || '' }}
